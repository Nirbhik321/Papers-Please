# Papers Please — configuration

db:
  path: data/papers.db

extraction:
  dpi: 300                      # render DPI for scanned PDFs
  min_native_text_per_page: 100 # chars — below this, switch to OCR

deduplication:
  similarity_threshold: 0.80    # cosine similarity for "same question"
  min_text_length: 10           # ignore sub-questions shorter than this

scoring:
  recency_decay: 0.85           # per-year decay factor (1.0 = current year)
  max_module_marks: 20          # max marks per module in the exam

tagger:
  preferred_models:             # Ollama models tried in order
    - phi3:mini
    - phi3
    - llama3.2:3b
    - mistral:7b

vtu_subjects:
  BCS501: Software Engineering
  BCS502: Computer Networks
  BCS503: Theory of Computation
  BCS504: Design and Analysis of Algorithms
  BCS505: Database Management Systems
  BCS506: Operating Systems
  BCS507: Computer Organization
  BCS515D: Distributed Systems
  BCS516D: Cloud Computing
  BCS517D: Machine Learning
  BCS518D: Artificial Intelligence
  BCS519D: Data Science
  BCS521D: Internet of Things
  BCS522D: Blockchain Technology
