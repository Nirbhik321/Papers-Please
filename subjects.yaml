# VTU 2022 Scheme — Computer Science & Allied Branches
# Covers all computer-stream B.E. programmes: CSE, ISE, AIML, AIDS, and allied streams.
# Semesters 1 through 6 (2022 scheme, effective from academic year 2023-24).
#
# Format: "SUBJECT_CODE": "Subject Name"
# Papers-Please reads this file at startup. To add a new subject, just add a line below.
# No code changes required.
#
# Key branch prefixes
#   BCS  — Computer Science & Engineering (CSE)
#   BIS  — Information Science & Engineering (ISE)
#   BAI  — Artificial Intelligence & Machine Learning (AIML)
#   BAD  — Artificial Intelligence & Data Science (AIDS)
#   BCM  — Computer & Communication Engineering
#   BCB  — Computer Science & Business Systems
#   BCI  — CSE (AI & ML specialisation)
#   BCD  — CSE (Data Science specialisation)
#   BCY  — CSE (Cyber Security specialisation)
#   BCO  — CSE (IoT specialisation)
#   BCX  — Math code common to CSE/AIDS/AIML (sem 3)


